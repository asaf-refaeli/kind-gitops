# Values for the upstream chart are nested under its dependency name.
# Only what is required or a deliberate choice; the rest of the chart's
# defaults are left alone on purpose.
argo-cd:
  configs:
    # Helm charts published by the release-notes CI as OCI artifacts. Public, so no credentials;
    # enableOCI makes Argo CD pull them with the OCI protocol instead of a Helm index.yaml.
    repositories:
      release-notes-charts:
        name: release-notes-charts
        type: helm
        url: ghcr.io/asaf-refaeli/charts
        enableOCI: "true"
    cm:
      # Health check for Argo CD's own Application kind, copied from the Argo CD
      # docs (operator-manual/health.md). Argo CD removed it in v1.8, so by
      # default a child Application counts as Healthy as soon as it exists.
      # Root's sync waves need it: without it, wave 1 (traefik) would start
      # before wave 0 (the Gateway API CRDs) is actually Healthy. With it, the
      # child's own health status becomes its health in the parent.
      resource.customizations.health.argoproj.io_Application: |
        hs = {}
        hs.status = "Progressing"
        hs.message = ""
        if obj.status ~= nil then
          if obj.status.health ~= nil then
            hs.status = obj.status.health.status
            if obj.status.health.message ~= nil then
              hs.message = obj.status.health.message
            end
          end
        end
        return hs

  # Off: the components below are unused here, and the laptop's memory is
  # tight (about 6 GiB for WSL on an 8 GB laptop).

  # Dex is the SSO bridge. Login is the local admin user only.
  dex:
    enabled: false

  # Notifications (Slack, email on sync events). Nothing to notify here.
  notifications:
    enabled: false

  # The chart has no "enabled" switch for the ApplicationSet controller, so it
  # is scaled to zero instead. Every Application here is a plain file in
  # bootstrap/apps/, so nothing creates ApplicationSets. The CRD stays
  # installed (it ships with the chart), which is harmless.
  applicationSet:
    replicas: 0
  # The first full sync renders every chart while two Postgres instances, Jobs and image pulls
  # start at once. With the chart's 1 s probe timeouts and no requests, repo-server and server
  # missed their probes under that load and were restarted (liveness kill, exit 137).
  # 5 s timeouts ride out a CPU spike; requests give each component a guaranteed share of the
  # node instead of whatever is left. No CPU limits (throttling); memory requests only, sized
  # from idle usage on kind.
  controller:
    readinessProbe:
      timeoutSeconds: 5
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
  repoServer:
    readinessProbe:
      timeoutSeconds: 5
    livenessProbe:
      timeoutSeconds: 5
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
  server:
    readinessProbe:
      timeoutSeconds: 5
    livenessProbe:
      timeoutSeconds: 5
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
  redis:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
