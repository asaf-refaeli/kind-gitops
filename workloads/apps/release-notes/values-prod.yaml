# prod environment values, merged over release-notes/chart/values.yaml.
# Only what prod sets; the two envs differ only in this file and values-dev.yaml.

image:
  # The same build as dev. Written by CI on each deploy (pushed by hand
  # until CI exists). The tag is for people; the digest decides what is pulled.
  tag: "0.1.1"
  digest: sha256:31dd65ffc67e94bffd0034153057b5556f93c0c3c30ec2301427bd53a2fa1ef9
# HPA on CPU (metrics-server). It owns the replica count, so replicaCount is
# not set. 2 to 4 is sized for an 8 GB laptop; a real cluster would set it
# from load tests. DB budget at 4 pods: (4 + 2) x 15 + 1 = 91 < 200
# connections (checked by the chart at render time).
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
# At most one app pod evicted at a time during a node drain (chart default,
# stated because it matters only here: dev has a single pod).
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
logLevel: INFO
# The HPA target is a percentage of requests.cpu, so the request is set here
# rather than left to the chart default (same numbers today). No CPU limit,
# to avoid throttling; the memory limit contains a leak.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
# HTTPRoute attached to the platform's Gateway (workloads/platform/traefik).
route:
  enabled: true
  hostname: prod.localhost
  gateway:
    name: web
    namespace: traefik
postgres:
  storage:
    # Larger than dev. kind's local-path provisioner does not enforce the
    # size; on a real cluster this is the volume that gets provisioned.
    size: 2Gi
